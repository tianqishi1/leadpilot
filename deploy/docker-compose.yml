services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: leadpilot, POSTGRES_PASSWORD: leadpilot, POSTGRES_DB: leadpilot}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes: ["../:/app"]
    command: bash -c "pip install -r requirements.txt psycopg[binary] && python -m uvicorn leadpilot.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://leadpilot:leadpilot@db:5432/leadpilot
      PYTHONPATH: /app/src
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-admin-password}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
    ports: ["8000:8000"]
    depends_on: [db]
  worker:
    image: python:3.11-slim
    working_dir: /app
    volumes: ["../:/app"]
    command: bash -c "pip install -r requirements.txt psycopg[binary] && python -m leadpilot.worker.main"
    environment:
      DATABASE_URL: postgresql+psycopg://leadpilot:leadpilot@db:5432/leadpilot
      PYTHONPATH: /app/src
    depends_on: [db]
volumes: {pgdata: {}}
