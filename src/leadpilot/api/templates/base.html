<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>{% block title %}LeadPilot{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
<style>body{font-family:system-ui,'Microsoft YaHei',sans-serif;margin:0;background:#f6f7f9;color:#222}
nav{background:#1f2937;color:#fff;padding:10px 16px}nav a{color:#cbd5e1;margin-right:14px;text-decoration:none}nav a:hover{color:#fff}
main{padding:16px;max-width:1100px;margin:0 auto}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #e5e7eb;padding:6px 8px;font-size:13px;text-align:left;vertical-align:top}
th{background:#f3f4f6}.btn{display:inline-block;padding:4px 10px;background:#2563eb;color:#fff;border:0;border-radius:4px;cursor:pointer;font-size:12px;text-decoration:none}
.btn.gray{background:#6b7280}.btn.red{background:#dc2626}.card{background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:12px;margin-bottom:12px}
.muted{color:#6b7280;font-size:12px}.tag{display:inline-block;padding:1px 6px;border-radius:3px;background:#e0e7ff;color:#3730a3;font-size:11px;margin-right:4px}</style></head>
<body><nav><b>LeadPilot P0</b>　<a href="/">看板</a><a href="/qa">质检</a><a href="/leads">线索池</a><a href="/content">内容</a><a href="/evidence">证据</a><a href="/intake">录入信号</a><a href="/settings">配置</a>　<a href="/logout" style="float:right">退出</a></nav>
<main>{% block body %}{% endblock %}</main></body></html>
