[project]
name = "leadpilot"
version = "0.1.0"
description = "AI 营销获客系统 P0 骨架（单人/Python/模块化单体+worker）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",
]
[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
